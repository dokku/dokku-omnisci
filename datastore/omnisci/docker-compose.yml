---
services:
  omnisci:
    image: "{{ .Image }}:{{ .ImageVersion }}"

    volumes:
      - type: bind
        source: "{{ .HostRoot }}/data"
        target: /omnisci-storage

    ports:
      # the port a client connects on, which is what a linked app is handed
      - name: native
        target: 6274
        primary: true

      # the http interface, which serves the same database over a different
      # protocol
      - name: http
        target: 6278

x-dokku:
  plugin: omnisci
  title: OmniSci
  scheme: omnisci
  alias: OMNISCI

  # the account the post-create step makes, rather than the service's own name,
  # unless the link names a user made in the service. The bash plugin puts the
  # service name here while creating an account called omnisci, so its url
  # names a user that was never made.
  dsn: "{{ .Scheme }}://{{ .Username }}:{{ .Password }}@{{ .Host }}:{{ .Port.native }}/{{ .Database }}"

  wait: native

  # the databases and users a service holds beside its own, made as admin.
  # Every user is given every privilege on each database the service holds,
  # and on each one made later, but is not a superuser as the service's own
  # account is. The client is chosen inline, as reset does, since a script is
  # only mounted into a container made after it was added. Names are checked
  # before they get here, so they are written as they are, and a password is
  # written to the client's stdin rather than passed as an argument.
  databases:
    create:
      exec:
        - sh
        - -c
        - |
          set -e
          client=/omnisci/bin/omnisql
          [ -x "$client" ] || client=/omnisci/bin/mapdql
          {
            printf "CREATE DATABASE %s (owner = 'omnisci');\n" "$1"
            for user in $2; do
              [ "$user" = omnisci ] || printf 'GRANT ALL ON DATABASE %s TO %s;\n' "$1" "$user"
            done
          } |
            "$client" --user=admin -p "$OMNISCI_ROOT_PASSWORD" -q >/dev/null
        - dokku-omnisci-create-database
        - "{{ .Args.database }}"
        - "{{ .Args.users }}"
      env:
        OMNISCI_ROOT_PASSWORD: "{{ .Secret.root_password }}"
    destroy:
      exec:
        - sh
        - -c
        - |
          set -e
          client=/omnisci/bin/omnisql
          [ -x "$client" ] || client=/omnisci/bin/mapdql
          printf 'DROP DATABASE %s;\n' "$1" |
            "$client" --user=admin -p "$OMNISCI_ROOT_PASSWORD" -q >/dev/null
        - dokku-omnisci-destroy-database
        - "{{ .Args.database }}"
      env:
        OMNISCI_ROOT_PASSWORD: "{{ .Secret.root_password }}"

  users:
    default: omnisci
    secret: password
    reserved: [admin]
    create:
      exec:
        - sh
        - -c
        - |
          set -e
          client=/omnisci/bin/omnisql
          [ -x "$client" ] || client=/omnisci/bin/mapdql
          password="$(printf '%s' "$NEW_PASSWORD" | sed "s/'/''/g")"
          {
            printf "CREATE USER %s (password = '%s', is_super = 'false');\n" "$1" "$password"
            for database in $2; do
              printf 'GRANT ALL ON DATABASE %s TO %s;\n' "$database" "$1"
            done
          } |
            "$client" --user=admin -p "$OMNISCI_ROOT_PASSWORD" -q >/dev/null
        - dokku-omnisci-create-user
        - "{{ .Args.user }}"
        - "{{ .Args.databases }}"
      env:
        OMNISCI_ROOT_PASSWORD: "{{ .Secret.root_password }}"
        NEW_PASSWORD: "{{ .NewSecret }}"
    destroy:
      exec:
        - sh
        - -c
        - |
          set -e
          client=/omnisci/bin/omnisql
          [ -x "$client" ] || client=/omnisci/bin/mapdql
          printf 'DROP USER %s;\n' "$1" |
            "$client" --user=admin -p "$OMNISCI_ROOT_PASSWORD" -q >/dev/null
        - dokku-omnisci-destroy-user
        - "{{ .Args.user }}"
      env:
        OMNISCI_ROOT_PASSWORD: "{{ .Secret.root_password }}"

    # the same text as the passwords' own changes, given the user to change
    change:
      exec:
        - sh
        - -c
        - |
          set -e
          user="$1"
          client=/omnisci/bin/omnisql
          [ -x "$client" ] || client=/omnisci/bin/mapdql
          password="$(printf '%s' "$NEW_PASSWORD" | sed "s/'/''/g")"
          printf "ALTER USER %s (password = '%s');\n" "$user" "$password" |
            "$client" --user=admin -p "$OMNISCI_ROOT_PASSWORD" -q >/dev/null
        - dokku-omnisci-change-password
        - "{{ .Args.user }}"
      env:
        OMNISCI_ROOT_PASSWORD: "{{ .Secret.root_password }}"
        NEW_PASSWORD: "{{ .NewSecret }}"


  secrets:
    password:
      file: PASSWORD
      length: 8
      env: SERVICE_PASSWORD

      # the account is made by the post create hook, so its new password is
      # given to it by the server, as admin. Inline rather than through
      # dokku-omnisci-sql, since a script is only mounted into a container made
      # after it was added. The same text as the root password's, which a test
      # holds them to.
      change:
        exec:
          - sh
          - -c
          - |
            set -e
            user="$1"
            client=/omnisci/bin/omnisql
            [ -x "$client" ] || client=/omnisci/bin/mapdql
            password="$(printf '%s' "$NEW_PASSWORD" | sed "s/'/''/g")"
            printf "ALTER USER %s (password = '%s');\n" "$user" "$password" |
              "$client" --user=admin -p "$OMNISCI_ROOT_PASSWORD" -q >/dev/null
          - dokku-omnisci-change-password
          - omnisci
        env:
          OMNISCI_ROOT_PASSWORD: "{{ .Secret.root_password }}"
          NEW_PASSWORD: "{{ .NewSecret }}"

    # the administrative account. The bash plugin writes the image's own
    # default here and then sets the password to what it just read, so every
    # service it creates keeps the password that ships with the image and is
    # the same in every installation. Generating one makes the password it
    # already meant to set an actual one, and is what --root-password sets.
    root_password:
      file: ROOTPASSWORD
      length: 16
      env: SERVICE_ROOT_PASSWORD

      # admin changes its own password, logged in with the one it has now
      change:
        exec:
          - sh
          - -c
          - |
            set -e
            user="$1"
            client=/omnisci/bin/omnisql
            [ -x "$client" ] || client=/omnisci/bin/mapdql
            password="$(printf '%s' "$NEW_PASSWORD" | sed "s/'/''/g")"
            printf "ALTER USER %s (password = '%s');\n" "$user" "$password" |
              "$client" --user=admin -p "$OMNISCI_ROOT_PASSWORD" -q >/dev/null
          - dokku-omnisci-change-password
          - admin
        env:
          OMNISCI_ROOT_PASSWORD: "{{ .Secret.root_password }}"
          NEW_PASSWORD: "{{ .NewSecret }}"

  hooks:
    post_create:
      # inside the service once it is answering: the account and the database
      # are made by talking to the server, so there has to be a server
      exec: ["dokku-omnisci-setup"]
      env:
        OMNISCI_DATABASE: "{{ .Database }}"
        OMNISCI_PASSWORD: "{{ .Secret.password }}"
        OMNISCI_ROOT_PASSWORD: "{{ .Secret.root_password }}"

  commands:
    # the account and database the dsn names. The client logs in as admin when
    # no user is given, whose password is the root password rather than this one
    connect:
      exec: ["dokku-omnisci-sql", "--db={{ .Database }}", "--user={{ .Username }}", "-p", "{{ .Password }}"]
      env:
        LANG: C.UTF-8
        LC_ALL: C.UTF-8

    # every view and then every table in the database is dropped, rather than
    # the database. A service named omnisci has the server's own database as
    # its own, and a database made again would leave the account's default_db
    # naming one that no longer exists. The client lists tables and views apart,
    # one name to a line, and exits non-zero on a statement that fails.
    #
    # the client is chosen here rather than through dokku-omnisci-sql, since a
    # script is only mounted into a container made after it was added, and a
    # reset runs in the container the service already has
    reset:
      exec:
        - sh
        - -c
        - |
          set -e
          database="$1"
          client=/omnisci/bin/omnisql
          [ -x "$client" ] || client=/omnisci/bin/mapdql
          sql() {
            "$client" --db="$database" --user=omnisci -p "$OMNISCI_PASSWORD" -q
          }
          views="$(printf '\\v\n' | sql)"
          tables="$(printf '\\t\n' | sql)"
          statements="$(
            printf '%s\n' "$views" | while IFS= read -r view; do
              [ -z "$view" ] || printf 'DROP VIEW IF EXISTS %s;\n' "$view"
            done
            printf '%s\n' "$tables" | while IFS= read -r table; do
              [ -z "$table" ] || printf 'DROP TABLE IF EXISTS %s;\n' "$table"
            done
          )"
          if [ -n "$statements" ]; then
            printf '%s\n' "$statements" | sql >/dev/null
          fi
        - dokku-omnisci-reset
        - "{{ .Database }}"
      env:
        OMNISCI_PASSWORD: "{{ .Secret.password }}"

  # no export or import: the client writes its results for a person to read
  # rather than as something to load back, and the image ships no dump tool.
  # Clone and the backup family fall out of that.
